name: Android build and tests
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'PRIVACY.md', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile, test policies and lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Prepare unsigned build for private signing
        run: |
          mkdir -p build-delivery
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-delivery/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-delivery/
          git rev-parse HEAD > build-delivery/source-commit.txt
          sha256sum build-delivery/*.apk > build-delivery/unsigned-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-apk-and-signer
          path: build-delivery/
          retention-days: 7
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -memory 2048
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/br.com.emanuel.navegador/files/qa qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-interface
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            qa/
          retention-days: 14
